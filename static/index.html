<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI/CD Test App</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --danger: #ef4444;
    --border: #334155;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(34, 197, 94, 0.15);
    color: var(--accent);
    border: 1px solid rgba(34, 197, 94, 0.35);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
  }

  .badge.offline {
    background: rgba(239, 68, 68, 0.15);
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.35);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 26px;
  }

  p.subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
  }

  .stack {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    flex: 1;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #052e16;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  button:hover {
    background: var(--accent-dark);
  }

  button:active {
    transform: scale(0.97);
  }

  ul#task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }

  li.task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }

  li.task span.title {
    flex: 1;
    font-size: 14px;
  }

  li.task.done span.title {
    text-decoration: line-through;
    color: var(--muted);
  }

  li.task input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  li.task .delete-btn {
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 16px;
    line-height: 1;
  }

  li.task .delete-btn:hover {
    color: var(--danger);
    background: transparent;
  }

  .empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="header">
      <span id="status-badge" class="badge"><span class="dot"></span> <span id="status-text">verificando…</span></span>
      <h1>CI/CD Test App</h1>
      <p class="subtitle">FastAPI + SQLite + Pytest &mdash; lista de tarefas para praticar pipelines.</p>
    </div>

    <form id="task-form" class="stack">
      <input type="text" id="task-input" placeholder="Nova tarefa..." autocomplete="off" required>
      <button type="submit">Adicionar</button>
    </form>

    <ul id="task-list"></ul>
    <p id="empty-message" class="empty" hidden>Nenhuma tarefa ainda. Adicione a primeira acima.</p>

    <footer>API em <code>/api/tasks</code> &middot; Health check em <code>/api/health</code></footer>
  </main>

  <script>
    const API_BASE = '/api';

    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    const emptyMessage = document.getElementById('empty-message');

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (!res.ok) throw new Error('unhealthy');
        statusBadge.classList.remove('offline');
        statusText.textContent = 'API online';
      } catch (err) {
        statusBadge.classList.add('offline');
        statusText.textContent = 'API offline';
      }
    }

    function renderTask(task) {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => toggleTask(task.id, checkbox.checked));

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = task.title;

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => deleteTask(task.id));

      li.append(checkbox, title, deleteBtn);
      return li;
    }

    async function loadTasks() {
      const res = await fetch(`${API_BASE}/tasks/`);
      const tasks = await res.json();
      taskList.innerHTML = '';
      tasks.forEach((task) => taskList.appendChild(renderTask(task)));
      emptyMessage.hidden = tasks.length !== 0;
    }

    async function createTask(title) {
      await fetch(`${API_BASE}/tasks/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      await loadTasks();
    }

    async function toggleTask(id, done) {
      await fetch(`${API_BASE}/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done }),
      });
      await loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE' });
      await loadTasks();
    }

    taskForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;
      taskInput.value = '';
      createTask(title);
    });

    checkHealth();
    loadTasks();
  </script>
</body>
</html>
