name: CI
    
on:
  push:
    branches:
      - main
      - develop


  pull_request:
    branches:
        - main
        - develop

permissions:
  contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Configurar Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
                cache: pip

            - name: Instalar dependencias
              run: pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest

    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'

            - name: Instalar Ruff
              run: pip install ruff

            - name: lint check
              run: ruff check .

    build:

      if: github.event_name == 'push'
      
      needs:
        - test
        - lint
        
      runs-on: ubuntu-latest

      steps:
          - name: Checkout
            uses: actions/checkout@v4   
            
          - name: Definir tag da imagem
            run: |
              if [ "${GITHUB_REF_NAME}" = "develop" ]; then
                echo "IMAGE_TAG=dev-${GITHUB_SHA}" >> "$GITHUB_ENV"
              elif [ "${GITHUB_REF_NAME}" = "main" ]; then
                echo "IMAGE_TAG=prod-${GITHUB_SHA}" >> "$GITHUB_ENV"
              else
                echo "Branch não permitida para publicação: ${GITHUB_REF_NAME}"
                exit 1
              fi  

          - name: Build imagem
            run: docker build -t ci-cd-testes:${{ github.sha }} .

          - name: AWS access
            uses: aws-actions/configure-aws-credentials@v6
            with:
              aws-access-key-id: ${{ secrets.KEY_ID_AWS }}
              aws-secret-access-key: ${{ secrets.ACCESS_KEY_AWS }}
              aws-region: ${{ secrets.AWS_REGION }}


          - name: AWS login
            uses: aws-actions/amazon-ecr-login@v2
                              
          - name: Tag SHA ECR
            run: docker tag ci-cd-testes:${{ github.sha }} 461837195972.dkr.ecr.sa-east-1.amazonaws.com/ci-cd-testes:${{ github.sha}}

          - name: Push to ECR
            run: docker push 461837195972.dkr.ecr.sa-east-1.amazonaws.com/ci-cd-testes:${{ github.sha}}