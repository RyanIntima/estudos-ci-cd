name: CI
    
on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Configurar Python
              uses: actions/setup-python@v7

            - name: Instalar dependencias
              run: pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest
